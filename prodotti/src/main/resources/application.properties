spring.application.name=prodotti

# Porta diversa da e-commerce (8080): i due servizi girano contemporaneamente
server.port=8081

# Database separato: solo il servizio prodotti legge e scrive la tabella prodotto
spring.datasource.url=jdbc:mysql://localhost:3306/prodottidb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
