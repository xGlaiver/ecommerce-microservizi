spring.application.name=e-commerce

server.port=8080

# Database di e-commerce: contiene solo le tabelle utente e ordine
spring.datasource.url=jdbc:mysql://localhost:3306/ecommercedb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view: false

# Indirizzo del microservizio prodotti (progetto separato)
prodotti.service.url=http://localhost:8081
